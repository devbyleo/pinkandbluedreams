<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1020">
  <title>pinkandbluedreams</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1020; color: #fff8fc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 15% 15%, #713d71 0, transparent 48%), radial-gradient(ellipse at 85% 85%, #304f82 0, transparent 48%), #1a1020; }
    main { width: min(100%, 600px); padding: 48px 32px; text-align: center; border: 1px solid #ffffff30; border-radius: 28px; background: #ffffff0d; box-shadow: 0 24px 80px #0006; backdrop-filter: blur(12px); }
    .mark { font-size: 32px; }
    h1 { margin: 18px 0 12px; font-size: clamp(2rem, 8vw, 3.25rem); }
    p { margin: 0; color: #e0ccdf; line-height: 1.7; }
    footer { margin-top: 32px; color: #c1adc2; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♡</div>
    <h1>pinkandbluedreams</h1>
    <p>A new space is taking shape. Please check back soon.</p>
    <footer>© pinkandbluedreams</footer>
  </main>
</body>
</html>
